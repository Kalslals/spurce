name: Perfect Mod Menu Injector

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-and-inject:
    runs-on: macos-latest
    permissions:
      contents: write

    steps:
    - name: Repo'yu Kopyala
      uses: actions/checkout@v4

    - name: Xcode ve Sistem Araçlarını Hazırla
      run: |
        sudo xcode-select -s /Applications/Xcode_15.2.app/Contents/Developer || true
        brew install ldid make wget

    - name: Theos Ortamını Kur
      run: |
        git clone --recursive https://github.com/theos/theos.git ~/theos
        echo "THEOS=~/theos" >> $GITHUB_ENV

    - name: Enjeksiyon Aracını Kur (insert_dylib)
      run: |
        git clone https://github.com/Tyilo/insert_dylib
        cd insert_dylib && g++ insert_dylib.cpp -o insert_dylib && sudo cp insert_dylib /usr/local/bin/

    - name: Test IPA Dosyasını İndir
      run: |
        wget -O Game.ipa "https://github.com/Hax4Extraction/MDC-ENT-Test-Apps/raw/main/Payloads/test.ipa"

    - name: Mod Menü Kodlarını Oluştur
      run: |
        mkdir -p Tweak
        
        cat << 'EOF' > Tweak/control
        Package: com.test.modmenu
        Name: TestModMenu
        Depends: mobilesubstrate
        Architecture: iphoneos-arm
        Description: Test Mod Menu
        Maintainer: User
        Author: User
        Section: Tweaks
        Version: 1.0.0
        EOF

        cat << 'EOF' > Tweak/Makefile
        THEOS_DEVICE_IP = localhost
        TARGET := iphoneos:clang:14.5:14.5
        ARCHS = arm64 arm64e

        include $(THEOS)/makefiles/common.mk

        TWEAK_NAME = TestModMenu
        TestModMenu_FILES = Tweak.xm
        TestModMenu_CFLAGS = -fobjc-arc

        include $(THEOS_MAKE_PATH)/tweak.mk
        EOF

        cat << 'EOF' > Tweak/Tweak.xm
        #import <UIKit/UIKit.h>

        %ctor {
            NSLog(@"[TestModMenu] Mod Menü kancası başarıyla yüklendi!");
            
            dispatch_after(dispatch_time(DISPATCH_TIME_NOW, (int64_t)(3.0 * NSEC_PER_SEC)), dispatch_get_main_query(), ^{
                UIWindow *window = [[UIApplication sharedApplication] keyWindow];
                
                UIAlertController *modMenu = [UIAlertController alertControllerWithTitle:@"🎮 Test Mod Menü" 
                                                                                  message:@"[✔] GitHub Actions Enjeksiyonu Başarılı!\n[!] Altyapı kusursuz çalışıyor." 
                                                                           preferredStyle:UIAlertControllerStyleAlert];
                
                [modMenu addAction:[UIAlertAction actionWithTitle:@"Tamam" style:UIAlertActionStyleDefault handler:nil]];
                [window.rootViewController presentViewController:modMenu animated:YES completion:nil];
            });
        }
        EOF

    - name: Modu Derle (.dylib)
      run: |
        export THEOS=~/theos
        make package
      working-directory: ./Tweak

    - name: IPA Dosyasına Enjekte Et ve Paketle
      run: |
        unzip -q Game.ipa -d Decoded_IPA
        APP_DIR=$(ls Decoded_IPA/Payload)
        BINARY_NAME=$(defaults read "$(pwd)/Decoded_IPA/Payload/$APP_DIR/Info.plist" CFBundleExecutable)
        
        echo "Hedef Binary: $BINARY_NAME"
        
        cp Tweak/.theos/obj/*.dylib "Decoded_IPA/Payload/$APP_DIR/"
        DYLIB_FILE=$(ls Tweak/.theos/obj/*.dylib | head -n 1 | xargs basename)
        
        insert_dylib "@executable_path/$DYLIB_FILE" "Decoded_IPA/Payload/$APP_DIR/$BINARY_NAME"
        
        cd Decoded_IPA && zip -9 -r ../Ready_Modded_Game.ipa Payload
        cd ..

    - name: Hazır IPA Dosyasını Kaydet (Artifact)
      uses: actions/upload-artifact@v4
      with:
        name: Ready-Modded-IPA
        path: Ready_Modded_Game.ipa
